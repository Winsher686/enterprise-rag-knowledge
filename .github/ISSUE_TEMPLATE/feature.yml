name: Feature request
description: 提出一个新功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 这个功能想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望如何实现？
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他替代方案？
    validations:
      required: false
