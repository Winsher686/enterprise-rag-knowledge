name: Bug report
description: 报告一个问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 请描述你遇到的问题
      placeholder: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: |
        1. 执行...
        2. 访问...
        3. 看到...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python 版本、Node 版本等
      placeholder: Windows 11, Python 3.11, Node 18
    validations:
      required: false
